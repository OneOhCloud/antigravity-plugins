name: Package & Release Plugins

on:
  push:
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Optional plugin name to package (leave empty for all plugins)'
        required: false
        default: ''
      tag:
        description: 'Release tag name (e.g. v1.3.1) for workflow_dispatch'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production UI bundles
        run: npm run build

      - name: Verify production bundle and syntax
        run: |
          for f in plugins/*/sidecars/*/*.mjs; do
            node --check "$f"
          done
          test -f plugins/agy-token-telemetry/sidecars/telemetry-pane/dist/index.html
          if [ -d .local/tests ]; then npm test; fi

      - name: Package per-plugin release archives
        env:
          OUT_DIR: ${{ runner.temp }}/release-assets
          PLUGIN_INPUT: ${{ github.event.inputs.plugin || '' }}
        run: |
          chmod +x scripts/package_plugins.sh
          if [[ -n "${PLUGIN_INPUT}" ]]; then
            ./scripts/package_plugins.sh "${PLUGIN_INPUT}"
          else
            ./scripts/package_plugins.sh
          fi
          ls -lh "${OUT_DIR}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release-assets/*.tar.gz
            ${{ runner.temp }}/release-assets/*.tar.gz.sha256
